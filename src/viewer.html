<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; font: 14px/1.4 system-ui, sans-serif; color-scheme: light dark; }
  body { display: flex; flex-direction: column; height: 500px; box-sizing: border-box; }
  body.fullscreen { height: 100vh; }
  header { display: flex; gap: 8px; align-items: center; padding: 6px 10px; }
  #title { flex: 1; min-width: 0; margin: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #stain { opacity: .7; white-space: nowrap; }
  #regions { display: flex; gap: 6px; padding: 0 10px 6px; overflow-x: auto; }
  #regions button { flex: none; padding: 2px 10px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; font: inherit; font-size: 12px; opacity: .7; cursor: pointer; }
  #regions button.active { opacity: 1; font-weight: 600; }
  main { flex: 1; min-height: 0; position: relative; background: #111; }
  #osd { position: absolute; inset: 0; }
  #fail { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; color: #eee; text-align: center; padding: 16px; }
  footer { padding: 4px 10px; font-size: 11px; opacity: .65; }
  [hidden] { display: none !important; }
</style>
<!-- %ORIGIN% is replaced by the Worker with its public origin; scripts are served from public/vendor (scripts/vendor.mjs). -->
<script src="%ORIGIN%/vendor/openseadragon-6.1.1.min.js"
  integrity="sha384-KKly+4vqqBHitr2XfNKWa3+0asIVpzYs2HijkM/zz0X6rgnyLuQEVERX9HqkM5/P" crossorigin="anonymous"></script>
<script type="importmap">
{ "integrity": { "%ORIGIN%/vendor/ext-apps-2.0.0-app-with-deps.js": "sha384-6ARQ6ltFzjAPfyWHwt3W/0sqMo0A8hIV2HwC+IEGFPojOlTLKfJBXuipD/90NCRI" } }
</script>
</head>
<body>
<header>
  <h1 id="title">Loading slide…</h1>
  <span id="stain"></span>
  <button id="zoom-out" aria-label="Zoom out">−</button>
  <button id="zoom-in" aria-label="Zoom in">+</button>
  <button id="home" aria-label="Whole slide">⌂</button>
  <button id="fullscreen" hidden>Fullscreen</button>
  <button id="open" hidden>Open in atlas</button>
</header>
<div id="regions" hidden></div>
<main>
  <div id="osd"></div>
  <div id="fail" hidden><span id="fail-text">The viewer can't load here.</span><button id="fail-open">Open in atlas</button></div>
</main>
<footer id="disclaimer">Educational images, not for diagnosing individual patients.</footer>
<script type="module">
import { App } from "%ORIGIN%/vendor/ext-apps-2.0.0-app-with-deps.js";

const $ = (id) => document.getElementById(id);
const TEXT = {
  en: { fullscreen: "Fullscreen", exit: "Exit fullscreen", open: "Open in atlas", fail: "The viewer can't load here.", missing: "Slide not found", disclaimer: "Educational images, not for diagnosing individual patients." },
  tr: { fullscreen: "Tam ekran", exit: "Tam ekrandan çık", open: "Atlasta aç", fail: "Görüntüleyici burada açılamıyor.", missing: "Kesit bulunamadı", disclaimer: "Eğitim amaçlı görüntülerdir, hasta tanısı için kullanılmaz." },
};
// Declaring the modes is required: hosts must refuse modes the app did not list. No 3rd arg, or autoResize turns off.
const app = new App({ name: "atlas-slide-viewer", version: "1.0.0" }, { availableDisplayModes: ["inline", "fullscreen"] });
let viewer, atlasUrl, t = TEXT.en;

function applyContext(ctx = app.getHostContext() ?? {}) {
  t = ctx.locale?.toLowerCase().startsWith("tr") ? TEXT.tr : TEXT.en;
  const fullscreen = ctx.displayMode === "fullscreen";
  document.body.classList.toggle("fullscreen", fullscreen);
  const inset = fullscreen ? ctx.safeAreaInsets : null;
  document.body.style.padding = inset ? `${inset.top}px ${inset.right}px ${inset.bottom}px ${inset.left}px` : "";
  if (!fullscreen) document.body.style.height = `${Math.min(500, ctx.containerDimensions?.maxHeight ?? 500)}px`;
  else document.body.style.height = "";
  $("fullscreen").hidden = !ctx.availableDisplayModes?.includes("fullscreen");
  $("fullscreen").textContent = fullscreen ? t.exit : t.fullscreen;
  $("open").textContent = $("fail-open").textContent = t.open;
  $("fail-text").textContent = t.fail;
  $("disclaimer").textContent = t.disclaimer;
  // Inline, plain wheel/one finger scrolls the chat; ctrl/cmd+wheel or two fingers zoom.
  viewer?.setCooperativeGestures(!fullscreen);
}

function showFailure() {
  $("fail").hidden = false;
  $("fail-open").hidden = !atlasUrl;
}

// Register before connect(): the host may send the tool result right after the handshake.
app.addEventListener("toolresult", ({ structuredContent: s, isError }) => {
  applyContext();
  if (isError || !s?.tileSource) {
    $("title").textContent = t.missing;
    $("regions").hidden = true;
    $("regions").innerHTML = "";
    return;
  }
  const tr = t === TEXT.tr;
  $("title").textContent = (tr ? s.title_tr || s.title_en : s.title_en || s.title_tr) ?? s.id;
  $("stain").textContent = s.stain ?? "";
  atlasUrl = (tr ? s.atlas_url_tr || s.atlas_url_en : s.atlas_url_en || s.atlas_url_tr) || s.viewer_url;
  $("open").hidden = !atlasUrl;
  $("fail").hidden = true;
  viewer?.destroy();
  viewer = OpenSeadragon({
    element: $("osd"),
    tileSources: s.tileSource,
    crossOriginPolicy: "Anonymous",
    drawer: "canvas",
    showNavigator: true,
    showNavigationControl: false, // header buttons instead: OSD's own buttons need 40 image files
    showFullPageControl: false,
    cooperativeGestures: app.getHostContext()?.displayMode !== "fullscreen",
  });

  // Named teaching regions (show_slide's structuredContent.regions, already quiz-filtered server-side): one
  // button per region, jumping the viewport there. Region data arrives inline with the tool result — the
  // viewer never fetches it, so this needs no CSP domain.
  const regionsEl = $("regions");
  regionsEl.innerHTML = "";
  const regionList = Array.isArray(s.regions) ? s.regions : [];
  regionsEl.hidden = regionList.length === 0;
  const zoomToRegion = (r) => viewer.viewport.fitBounds(
    viewer.viewport.imageToViewportRectangle(new OpenSeadragon.Rect(r.x, r.y, r.width, r.height)), true);
  for (const r of regionList) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = (tr ? r.label_tr || r.label_en : r.label_en || r.label_tr) || r.id;
    const note = tr ? r.note_tr || r.note_en : r.note_en || r.note_tr;
    if (note) btn.title = note;
    if (s.region && r.id === s.region.id) btn.classList.add("active");
    btn.onclick = () => {
      zoomToRegion(r);
      for (const b of regionsEl.children) b.classList.toggle("active", b === btn);
    };
    regionsEl.appendChild(btn);
  }
  // show_slide's `region` param resolved to a match: open zoomed to it instead of the whole slide. tileSources
  // here is an inline descriptor (no fetch), so the viewer may already be open by the time we get here.
  if (s.region) {
    const zoomOnce = () => zoomToRegion(s.region);
    if (viewer.isOpen()) zoomOnce();
    else viewer.addOnceHandler("open", zoomOnce);
  }

  let loaded = 0, failed = 0;
  viewer.addHandler("open-failed", showFailure);
  viewer.addHandler("tile-loaded", () => loaded++);
  viewer.addHandler("tile-load-failed", () => { if (++failed >= 8 && loaded === 0) showFailure(); });
});

app.addEventListener("hostcontextchanged", () => applyContext());

$("fullscreen").onclick = async () => {
  const next = app.getHostContext()?.displayMode === "fullscreen" ? "inline" : "fullscreen";
  const { mode } = await app.requestDisplayMode({ mode: next });
  applyContext({ ...app.getHostContext(), displayMode: mode });
};
$("zoom-in").onclick = () => viewer?.viewport.zoomBy(1.5).applyConstraints();
$("zoom-out").onclick = () => viewer?.viewport.zoomBy(1 / 1.5).applyConstraints();
$("home").onclick = () => viewer?.viewport.goHome();
$("open").onclick = $("fail-open").onclick = () => app.openLink({ url: atlasUrl });

await app.connect();
applyContext();
</script>
</body>
</html>
